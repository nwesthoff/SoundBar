name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the release (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      SCHEME: BarAudioSource
      CONFIG: Release
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (ad-hoc signed)
        run: |
          xcodebuild \
            -project BarAudioSource.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIG" \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            build

      - name: Re-sign bundle ad-hoc (deep)
        run: |
          APP="build/Build/Products/$CONFIG/$SCHEME.app"
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Package .app into zip
        run: |
          APP="build/Build/Products/$CONFIG/$SCHEME.app"
          test -d "$APP" || { echo "App bundle not found at $APP"; exit 1; }
          mkdir -p dist
          ZIP="dist/$SCHEME-$TAG.zip"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          shasum -a 256 "$ZIP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarAudioSource-${{ env.TAG }}
          path: ${{ env.ZIP }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          generate_release_notes: true
          files: ${{ env.ZIP }}
          fail_on_unmatched_files: true
